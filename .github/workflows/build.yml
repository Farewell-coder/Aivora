name: build

# 【职责】Aivora 的 CI：单元测试 + 正式签名 release APK + 产物下载 / Release 发布。
#
# 触发：
#   · push / PR        → 测试 + 构建，APK 传成 artifact（保留 90 天）
#   · push tag v*      → 额外发 GitHub Release（永久链接）
#   · workflow_dispatch → 手动跑
#
# 【签名】密钥不入库，运行时从 Secrets 还原：
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# 生成工作区根目录的 keystore.properties，app/build.gradle.kts 会自动读取。
# 缺任一 Secret 直接失败，不伪造临时签名。
#
# 【注意 gradle.properties】工程原有 android.aapt2FromMavenOverride 指向手机本地路径，
# 已在版本库中移除（runner 是 x86-64，用 Maven 版 aapt2 即可）。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 工程 compileSdk = 35、build-tools 由 AGP 决定，这里显式装一份 35.0.0
      - name: 安装编译平台
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/ci-keystore.jks"
          if [ ! -s "${GITHUB_WORKSPACE}/ci-keystore.jks" ]; then
            echo "::error::KEYSTORE_BASE64 解码失败，请确认是完整的 base64 内容"
            exit 1
          fi
          cat > "${GITHUB_WORKSPACE}/keystore.properties" <<EOF
          storeFile=${GITHUB_WORKSPACE}/ci-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          chmod 600 "${GITHUB_WORKSPACE}/ci-keystore.jks" "${GITHUB_WORKSPACE}/keystore.properties"
          keytool -list -keystore "${GITHUB_WORKSPACE}/ci-keystore.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "签名配置就绪"

      - name: 赋权 gradlew
        run: chmod +x ./gradlew

      - name: 单元测试
        run: ./gradlew test --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: 编译 release（含签名）
        run: ./gradlew assembleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/ || true

      - name: 校验签名与产物命名
        run: |
          set -e
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::没有生成任何 APK"
            exit 1
          fi
          for a in "${APKS[@]}"; do
            echo "===== $a"
            "$APKSIGNER" verify --print-certs "$a"
          done
          # 若产物文件名里带 unsigned，说明签名配置没生效，直接失败
          for a in "${APKS[@]}"; do
            case "$a" in *unsigned*) echo "::error::产物未签名：$a"; exit 1;; esac
          done
          # 【产物命名】必须与 versionName 一致，形如 Aivora-v0.0.7.apk。
          # 命名规则定义在 app/build.gradle.kts 的 applicationVariants 里；
          # 这里再断言一次，避免哪天改名规则失效后 Release 上又出现 app-release.apk。
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          EXPECTED="app/build/outputs/apk/release/Aivora-v${VERSION_NAME}.apk"
          if [ ! -f "$EXPECTED" ]; then
            echo "::error::产物命名不符合约定，期望 $EXPECTED"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "产物命名正确：Aivora-v${VERSION_NAME}.apk"

      - name: 上传 APK（Artifacts，保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: aivora-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 上传测试报告（失败时便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # 先解析公告，再发布。action-gh-release 的 body_path 不支持条件表达式，
      # 所以把「本次 tag 对应的公告文件 + 标题」先算成 step outputs。
      - name: 解析发布公告
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          FILE="release-notes/${TAG}.md"
          if [ -f "$FILE" ]; then
            TITLE=$(grep -m1 '^# ' "$FILE" | sed 's/^# *//')
            {
              echo "file=$FILE"
              echo "title=${TITLE:-Aivora ${TAG}}"
            } >> "$GITHUB_OUTPUT"
            echo "使用仓库内公告：$FILE"
          else
            echo "::warning::未找到 release-notes/${TAG}.md，将退回自动生成的发布说明"
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "title=Aivora ${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 【标题】取 release-notes/<tag>.md 第一行的 "# " 标题。
          # 不在这里硬编码，否则每次 tag 构建都会把手写标题覆盖回通用文案。
          name: ${{ steps.notes.outputs.title }}
          # 【正文】优先用仓库里的 release-notes/<tag>.md；
          # 没有该文件时退回自动生成的发布说明，绝不覆盖成通用模板。
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk