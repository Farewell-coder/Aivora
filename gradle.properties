org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# 【已移除】android.aapt2FromMavenOverride=/root/aapt2-wrapper/aapt2
# 那是手机（arm64）本地构建专用：AGP 从 Maven 拉的 aapt2 是 x86-64 二进制，
# 手机上跑不了，必须指向自编译的 aarch64 版。
# 但 GitHub Actions 的 runner 本身就是 x86-64，本来就能直接用 Maven 版，
# 指定这个路径反而会报 "Specified AAPT2 executable does not exist" 而整个构建失败。
# 本机需要时请放到 ~/.gradle/gradle.properties（不受版本控制）里，不要写进本文件。
kotlin.code.style=official